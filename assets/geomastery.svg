<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#050a14" />
    </radialGradient>

    <!-- Globe Sphere Ocean -->
    <radialGradient id="globe-ocean" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#143158" />
      <stop offset="50%" stop-color="#0d213d" />
      <stop offset="100%" stop-color="#061224" />
    </radialGradient>

    <!-- Atmosphere Rim Glow -->
    <radialGradient id="atmo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="94%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Landmass Gradient -->
    <linearGradient id="land-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-glow)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12" opacity="0.3" />

  <!-- Globe Ocean Sphere -->
  <circle cx="256" cy="256" r="170" fill="url(#globe-ocean)" />

  <!-- Graticule Lines (Globe grid) -->
  <!-- Equator & Parallels -->
  <ellipse cx="256" cy="256" rx="170" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
  <ellipse cx="256" cy="180" rx="146" ry="20" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.2" />
  <ellipse cx="256" cy="332" rx="146" ry="20" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.2" />

  <!-- Meridians -->
  <ellipse cx="256" cy="256" rx="60" ry="170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
  <ellipse cx="256" cy="256" rx="120" ry="170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />
  <line x1="256" y1="86" x2="256" y2="426" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />

  <!-- Stylized Continents on Globe -->
  <!-- Eurasia / Africa shape -->
  <path d="M 230 140 Q 250 130 280 145 Q 310 160 330 190 Q 320 220 290 230 Q 280 250 290 280 Q 275 310 260 340 Q 240 330 235 290 Q 220 270 210 240 Q 200 200 215 160 Z" fill="url(#land-grad)" opacity="0.95" />
  
  <!-- Americas shape (west) -->
  <path d="M 130 160 Q 155 150 175 170 Q 165 210 150 230 Q 160 260 170 300 Q 160 340 140 330 Q 125 290 130 240 Q 120 200 130 160 Z" fill="url(#land-grad)" opacity="0.9" />

  <!-- Islands & details -->
  <circle cx="345" cy="265" r="14" fill="url(#land-grad)" opacity="0.9" />
  <circle cx="330" cy="310" r="18" fill="url(#land-grad)" opacity="0.9" />
  <circle cx="210" cy="130" r="10" fill="url(#land-grad)" opacity="0.9" />

  <!-- Atmospheric Glow Border -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.75" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#0ea5e9" stroke-width="6" opacity="0.3" filter="url(#glow)" />

  <!-- Floating Golden Pin / Compass Icon in Foreground -->
  <g transform="translate(256, 210) scale(1.15)" filter="url(#glow)">
    <!-- Pin shadow -->
    <ellipse cx="0" cy="38" rx="14" ry="5" fill="#000" opacity="0.4" />
    
    <!-- Pin Shape -->
    <path d="M 0 32 C -18 12 -22 -6 -22 -18 C -22 -30 -12 -40 0 -40 C 12 -40 22 -30 22 -18 C 22 -6 18 12 0 32 Z" fill="url(#pin-grad)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Pin Center Core -->
    <circle cx="0" cy="-18" r="8" fill="#ffffff" />
  </g>
</svg>
